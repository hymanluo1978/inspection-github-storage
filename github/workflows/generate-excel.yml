import json
import os
from datetime import datetime
from openpyxl import Workbook
from openpyxl.styles import Font, Alignment, PatternFill, Border, Side
from openpyxl.utils import get_column_letter
 
data_dir = 'data'
records = []
 
for filename in os.listdir(data_dir):
if filename.endswith('.json'):
with open(os.path.join(data_dir, filename), 'r', encoding='utf-8') as f:
records.append(json.load(f))
 
records.sort(key=lambda x: x['id'], reverse=True)
 
wb = Workbook()
ws = wb.active
ws.title = '巡检记录'
 
headers = ['记录编号', '巡检日期', '巡检地点', '巡检人员', '检查项目', 
'检查结果', '问题描述', '整改要求', '备注', '提交时间', '照片数量']
 
header_fill = PatternFill(start_color='0F4C81', end_color='0F4C81', fill_type='solid')
header_font = Font(bold=True, color='FFFFFF', size=11)
thin_border = Border(
left=Side(style='thin'),
right=Side(style='thin'),
top=Side(style='thin'),
bottom=Side(style='thin')
)
 
for col, header in enumerate(headers, 1):
cell = ws.cell(row=1, column=col, value=header)
cell.fill = header_fill
cell.font = header_font
cell.alignment = Alignment(horizontal='center', vertical='center')
cell.border = thin_border
 
for row, record in enumerate(records, 2):
ws.cell(row=row, column=1, value=record['id']).border = thin_border
ws.cell(row=row, column=2, value=record['date']).border = thin_border
ws.cell(row=row, column=3, value=record['location']).border = thin_border
ws.cell(row=row, column=4, value=record['inspector']).border = thin_border
ws.cell(row=row, column=5, value=record['checkItem']).border = thin_border
result_cell = ws.cell(row=row, column=6, value=record['checkResult'])
result_cell.border = thin_border
if record['checkResult'] == '合格':
result_cell.font = Font(color='10B981', bold=True)
elif record['checkResult'] == '待整改':
result_cell.font = Font(color='F59E0B', bold=True)
else:
result_cell.font = Font(color='EF4444', bold=True)
ws.cell(row=row, column=7, value=record['issueDesc']).border = thin_border
ws.cell(row=row, column=8, value=record['rectifyReq']).border = thin_border
ws.cell(row=row, column=9, value=record['remarks']).border = thin_border
ws.cell(row=row, column=10, value=record['createdAt']).border = thin_border
ws.cell(row=row, column=11, value=len(record['images'])).border = thin_border
 
for col in range(1, len(headers) + 1):
ws.column_dimensions[get_column_letter(col)].width = 15
 
ws.column_dimensions['A'].width = 18
ws.column_dimensions['C'].width = 20
ws.column_dimensions['G'].width = 30
ws.column_dimensions['H'].width = 25
ws.column_dimensions['I'].width = 20
ws.column_dimensions['J'].width = 20
 
ws.row_dimensions[1].height = 30
 
summary_ws = wb.create_sheet('数据统计')
summary_data = [
['统计项目', '数值'],
['总记录数', len(records)],
['合格数量', sum(1 for r in records if r['checkResult'] == '合格')],
['待整改数量', sum(1 for r in records if r['checkResult'] == '待整改')],
['不合格数量', sum(1 for r in records if r['checkResult'] == '不合格')],
['总照片数', sum(len(r['images']) for r in records)],
['', ''],
['生成时间', datetime.now().strftime('%Y-%m-%d %H:%M:%S')]
]
 
for row_idx, row_data in enumerate(summary_data, 1):
for col_idx, value in enumerate(row_data, 1):
cell = summary_ws.cell(row=row_idx, column=col_idx, value=value)
if row_idx == 1:
cell.fill = header_fill
cell.font = header_font
cell.border = thin_border
cell.alignment = Alignment(horizontal='center', vertical='center')
 
summary_ws.column_dimensions['A'].width = 15
summary_ws.column_dimensions['B'].width = 20
 
date_str = datetime.now().strftime('%Y%m%d_%H%M%S')
output_file = f'巡检记录台账_{date_str}.xlsx'
wb.save(output_file)
print(f'Excel report generated: {output_file}')
EOF
 
